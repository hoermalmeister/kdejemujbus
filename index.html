<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" id="viewport-meta" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>KdeJeMujBus</title>
    
    <script defer src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; touch-action: pan-x pan-y; }
        body { position: fixed; inset: 0; font-family: sans-serif; }
        #map { position: absolute; inset: 0; background: #222; }
        #status { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); color: white; padding: 12px; border-radius: 8px; z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div id="status">Načítám data z GRAPPu...</div>
    <div id="map"></div>
    <div id="detail-panel">
        <div class="panel-header">
            <h3 id="panel-title">Načítám...</h3>
            <button class="panel-close-btn" id="panel-close">&times;</button>
        </div>
        <div class="panel-content" id="panel-body">
        </div>
    </div>
    <div id="locate-btn" title="Moje poloha">🔵</div>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
