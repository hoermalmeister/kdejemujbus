<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" id="viewport-meta" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>KdeJeMujBus</title>
    
    <script defer src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; touch-action: pan-x pan-y; }
        body { position: fixed; inset: 0; font-family: sans-serif; }
        #map { position: absolute; inset: 0; background: #222; }
        #status { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); color: white; padding: 12px; border-radius: 8px; z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div id="status">Načítám data z GRAPPu...</div>
    <div id="map"></div>
    <div id="detail-panel">
        <div class="panel-header">
            <h3 id="panel-title">Načítám...</h3>
            <button class="panel-close-btn" id="panel-close">&times;</button>
        </div>
        <div class="panel-content" id="panel-body">
        </div>
    </div>
    <div id="locate-btn" title="Moje poloha">🔵</div>
    <button id="reload-btn" class="map-btn" type="button" title="Znovu načíst stránku bez mezipaměti" aria-label="Znovu načíst stránku">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button id="filter-btn" class="map-btn" type="button" title="Zobrazené oblasti" aria-label="Zobrazené oblasti" aria-expanded="false" aria-controls="region-menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M4.25 5.61C6.27 8.2 10 13 10 13v6c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-6s3.72-4.8 5.74-7.39A.998.998 0 0 0 18.95 4H5.04c-.83 0-1.3.95-.79 1.61z"/></svg>
    </button>
    <div id="region-menu" hidden></div>
    <a id="info-btn" class="map-btn" href="https://github.com/hoermalmeister/kdejemujbus/" target="_blank" rel="noopener" title="O projektu (GitHub)" aria-label="O projektu">i</a>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
